name: CI/CD Pipeline - Projeto Moda

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-quality:
    name: Backend Lint, Testes & Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx
          pip install -r requirements.txt

      - name: Análise Estática com Ruff
        run: |
          ruff check .

      - name: Executar Testes Automatizados com Pytest
        env:
          DATABASE_URL: sqlite:///:memory:
          CHROMA_PERSIST_DIRECTORY: ./data/test_chroma
        run: |
          pytest tests/ -v --cov=. --cov-report=term

  frontend-quality:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Executar Lint do Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Compilar Frontend (Build de Produção)
        working-directory: ./frontend
        run: npm run build
