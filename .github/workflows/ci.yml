name: CI/CD Pipeline - Projeto Moda

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-quality:
    name: Backend Lint, Testes & Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx
          pip install -r requirements.txt

      - name: Análise Estática com Ruff
        run: |
          ruff check .

      - name: Executar Testes Automatizados com Pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          CHROMA_PERSIST_DIRECTORY: "./data/test_chroma"
        run: |
          pytest tests/ -v --cov=. --cov-report=term

  frontend-quality:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Executar Lint do Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Compilar Frontend (Build de Produção)
        working-directory: ./frontend
        run: npm run build

  deploy:
    name: Deploy Contínuo (Azure VM)
    needs: [backend-quality, frontend-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração de credenciais Azure
        id: check-secrets
        run: |
          if [ -n "${{ secrets.AZURE_VM_HOST }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Aguardando configuração dos secrets AZURE_VM_HOST para deploy remoto."
          fi

      - name: Atualizar contêineres na VM Azure
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          script: |
            cd /home/azureuser/projeto-moda
            git pull origin main
            docker compose up -d --build
